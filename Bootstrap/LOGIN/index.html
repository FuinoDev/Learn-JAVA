<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">
                <i class="bi bi-person"></i>
            </div>

            <h1 id="authTitle">Welcome Back</h1>

            <p id="authDescription">
                Sign in to continue to your account.
            </p>

        </div>

        <div id="loginSection" class="auth-section active">

            <form id="loginForm">

                <div class="mb-3">

                    <label
                            for="loginEmail"
                            class="form-label"
                    >
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                                type="email"
                                class="form-control"
                                id="loginEmail"
                                placeholder="fuinodev@example.com"
                                required
                        >

                    </div>

                </div>

                <div class="mb-3">

                    <label
                            for="loginPassword"
                            class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                                type="password"
                                class="form-control"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                        >

                        <button
                                type="button"
                                class="btn password-button"
                                id="loginPasswordButton"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">

                        <input
                                class="form-check-input"
                                type="checkbox"
                                id="rememberMe"
                        >

                        <label
                                class="form-check-label"
                                for="rememberMe"
                        >
                            Remember me
                        </label>

                    </div>

                    <a href="#" class="auth-link">
                        Forgot password?
                    </a>

                </div>

                <button
                        type="submit"
                        class="btn auth-button w-100"
                >
                    Sign In
                </button>

            </form>

            <div class="switch-text">

                Don't have an account?

                <button
                        type="button"
                        class="switch-button"
                        id="showRegister"
                >
                    Create account
                </button>

            </div>

        </div>

        <div id="registerSection" class="auth-section">

            <form id="registerForm">

                <div class="row">

                    <div class="col-6 mb-3">

                        <label
                                for="firstName"
                                class="form-label"
                        >
                            First Name
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="firstName"
                                placeholder="First name"
                                required
                        >

                    </div>

                    <div class="col-6 mb-3">

                        <label
                                for="lastName"
                                class="form-label"
                        >
                            Last Name
                        </label>

                        <input
                                type="text"
                                class="form-control"
                                id="lastName"
                                placeholder="Last name"
                                required
                        >

                    </div>

                </div>

                <div class="mb-3">

                    <label
                            for="registerEmail"
                            class="form-label"
                    >
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                                type="email"
                                class="form-control"
                                id="registerEmail"
                                placeholder="fuinodev@example.com"
                                required
                        >

                    </div>

                </div>

                <div class="mb-3">

                    <label
                            for="registerPassword"
                            class="form-label"
                    >
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                                type="password"
                                class="form-control"
                                id="registerPassword"
                                placeholder="At least 8 characters"
                                minlength="8"
                                required
                        >

                        <button
                                type="button"
                                class="btn password-button"
                                id="registerPasswordButton"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <div class="mb-3">

                    <label
                            for="confirmPassword"
                            class="form-label"
                    >
                        Confirm Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-shield-lock"></i>
                        </span>

                        <input
                                type="password"
                                class="form-control"
                                id="confirmPassword"
                                placeholder="Confirm password"
                                minlength="8"
                                required
                        >

                    </div>

                    <small id="passwordMessage"></small>

                </div>

                <div class="form-check mb-4">

                    <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms"
                            required
                    >

                    <label
                            class="form-check-label"
                            for="terms"
                    >
                        I agree to the
                        <a href="#" class="auth-link">
                            Terms and Conditions
                        </a>
                    </label>

                </div>

                <button
                        type="submit"
                        class="btn auth-button w-100"
                >
                    Create Account
                </button>

            </form>

            <div class="switch-text">

                Already have an account?

                <button
                        type="button"
                        class="switch-button"
                        id="showLogin"
                >
                    Sign in
                </button>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
